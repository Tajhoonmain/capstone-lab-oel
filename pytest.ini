[pytest]
# Discover tests only in the tests/ directory
testpaths = mcp_project/tests

# Test file naming convention
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output verbosity
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    unit: Unit tests — no external calls (fast, always run in CI)
    integration: Integration tests — requires real API keys (gated to main branch)
    slow: Tests that take > 10 seconds
